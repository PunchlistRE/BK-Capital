name: diag (temporary)
# Temporary: shows, with every check visible, the audit sections that fail only on the CI runner. Removed before the change is merged.
on: push
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: the runner's fonts and browser
        run: |
          echo "fonts installed: $(fc-list | wc -l)"; fc-list : family | sort -u | head -40; echo "sans-serif -> $(fc-match sans-serif)"; echo "serif -> $(fc-match serif)"; echo "monospace -> $(fc-match monospace)"
          node -e "console.log('playwright', require('playwright/package.json').version)"; pdftotext -v 2>&1 | head -1
      - name: the sections that fail on the runner, every failing check shown
        run: |
          export PLAYWRIGHT_MODULE=$PWD/node_modules/playwright
          for t in print_years_test layout_test paneltabs_test; do echo "=================== $t"; node audit/$t.js index.html 2>&1 | grep -v '^PASS' | cut -c1-700; done; true
