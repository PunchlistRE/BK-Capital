name: audit
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node build.js --check && node build.js --lint
      # the parallel runner must cover exactly what audit/run_all.sh runs and must report a failing section; both are proved before any test is trusted
      - run: python3 audit/run_parallel.py --check && python3 audit/run_parallel.py --selftest
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils fonts-inter   # pdftotext / pdfinfo for the print and schedule-report tests; Inter, the app's UI font (the tests block web fonts, so layout checks need it installed)
      - run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      # every section of audit/run_all.sh, three at a time; each section's output is printed (as the serial script did) and a failing section is named, with its output, in the summary
      - run: PLAYWRIGHT_MODULE=$PWD/node_modules/playwright python3 audit/run_parallel.py --workers 3 --logs all --out "$RUNNER_TEMP/audit"
